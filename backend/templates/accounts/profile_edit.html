<style>
    :root {
        --primary-blue: #2563eb;
        --focus-blue: #3b82f6;
        --gradient-blue: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        --text-main: #1e293b;
        --text-secondary: #64748b;
        --border-color: #cbd5e1;
        --card-white: #ffffff;
    }

    .profile-container {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 60px 20px;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #fafafa;
        min-height: 80vh;
    }

    .form-card {
        background: var(--card-white);
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(37, 99, 235, 0.05), 0 1px 3px rgba(0, 0, 0, 0.02);
        width: 100%;
        max-width: 500px;
        padding: 40px;
        border: 1px solid #e2e8f0;
    }

    .form-card h2 {
        margin: 0;
        color: var(--text-main);
        font-size: 24px;
        font-weight: 700;
        text-align: center;
        letter-spacing: -0.5px;
    }

    .subtitle {
        color: var(--text-secondary);
        text-align: center;
        margin-top: 6px;
        margin-bottom: 30px;
        font-size: 14px;
    }

    .responsive-form {
        display: flex;
        flex-direction: column;
        gap: 22px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .form-group label {
        font-weight: 600;
        color: var(--text-main);
        font-size: 13px;
        letter-spacing: 0.3px;
    }

    .form-group input {
        padding: 12px 16px;
        border: 1px solid var(--border-color);
        border-radius: 10px;
        font-size: 14px;
        color: var(--text-main);
        outline: none;
        background-color: #fcffff;
        transition: all 0.2s ease;
    }

    .form-group input:focus {
        border-color: var(--focus-blue);
        background-color: #ffffff;
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
    }

    .form-help {
        color: #94a3b8;
        font-size: 12px;
        margin-top: 4px;
    }

    .form-actions {
        display: flex;
        gap: 12px;
        margin-top: 10px;
    }

    .btn {
        padding: 14px 20px;
        border-radius: 12px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        text-align: center;
        font-size: 15px;
        border: none;
        flex: 1;
        transition: all 0.2s ease;
    }

    .btn-submit {
        background: var(--gradient-blue);
        color: white;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
    }

    .btn-submit:hover {
        box-shadow: 0 6px 20px rgba(37, 99, 235, 0.25);
        opacity: 0.95;
    }

    .btn-cancel {
        background-color: transparent;
        color: var(--text-secondary);
        border: 1px solid var(--border-color);
    }

    .btn-cancel:hover {
        background-color: #f8fafc;
        color: var(--text-main);
    }

    @media (max-width: 400px) {
        .form-actions {
            flex-direction: column-reverse;
        }
    }
</style>

<div class="profile-container">
    <div class="form-card">
        <h2>Edit Profile</h2>
        <p class="subtitle">Update your academic information below.</p>
        
        <form method="POST" action="{% url 'profile_edit' %}" class="responsive-form">
           
            
            <div class="form-group">
                <label for="school">SCHOOL</label>
                <input type="text" id="school" name="school" value="{{ user.school }}" required>
            </div>
            
            <div class="form-group">
                <label for="department">DEPARTMENT</label>
                <input type="text" id="department" name="department" value="{{ user.department }}" required>
            </div>
            
            <div class="form-group">
                <label for="level">LEVEL</label>
                <input type="text" id="level" name="level" value="{{ user.level }}" required>
            </div>
            
            <div class="form-group">
                <label for="matricule">MATRICULE (OPTIONAL)</label>
                <input type="text" id="matricule" name="matricule" value="{{ user.matricule }}" placeholder="e.g., UB26-SCI-456">
                <small class="form-help">You can save this blank and add your matricule whenever you receive it[cite: 69, 70].</small>
            </div>
            
            <div class="form-actions">
                <a href="{% url 'profile' %}" class="btn btn-cancel">Cancel</a>
                <button type="submit" class="btn btn-submit">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
