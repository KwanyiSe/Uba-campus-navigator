{% extends "base.html" %}{% block title %}UNIMAP — Feedback{% endblock %}
{% block content %}
<div class="section-head"><div><div class="eyebrow">Support</div><h1>Feedback</h1></div></div>
<div class="card" style="padding:22px;max-width:720px">
<p class="muted" style="font-size:13px">Tell us what would make UNIMAP better.</p>
<form id="feedbackForm">
{% if not user.is_authenticated %}<div class="grid grid-2"><div class="field"><label>Name</label><input id="name" name="name" required></div><div class="field"><label>Email</label><input id="email" name="email" type="email" required></div></div>{% endif %}
<div class="field"><label>Subject</label><input id="subject" name="subject" required></div>
<div class="field"><label>Message</label><textarea id="message" name="message" rows="6" required></textarea></div>
<button class="btn btn-primary" type="submit">Submit feedback</button><span id="result" class="muted" style="margin-left:10px;font-size:12px"></span>
</form></div>
<script>
document.getElementById("feedbackForm").addEventListener("submit",async e=>{e.preventDefault();const d={subject:subject.value,message:message.value};if(document.getElementById("name")){d.name=name.value;d.email=email.value}const r=await fetch("/api/feedback/submit/",{method:"POST",headers:{"Content-Type":"application/json","X-CSRFToken":"{{ csrf_token }}"},body:JSON.stringify(d)});const b=await r.json().catch(()=>({}));result.textContent=r.ok?"Feedback submitted successfully.":(b.detail||"Could not submit feedback.")});
</script>
{% endblock %}
