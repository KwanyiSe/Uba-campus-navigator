<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Navbar</title>

        <style>
            .navbar{
                display: flex;
                gap: 15px;
                padding: 15px;
            }

            .navbar a{
                text-decoration: none;
                color: #1A56DB;
                font-weight: 600;
            }
        </style>
    </head>
        
    <nav class="navbar">
        {% if user.is_authenticated %}

            <a href="{% url 'profile' %}">
                profile
            </a>

            <a href="{% url 'feedback_list' %}">
                feedback_list
            </a>

            <a href="{% url 'logout' %}">
                Logout
            </a>

        {% else %}
