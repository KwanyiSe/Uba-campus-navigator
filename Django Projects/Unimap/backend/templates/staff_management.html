{% extends "base.html" %}{% block title %}Staff management · UNIMAP{% endblock %}{% block content %}<div class="card"><h1>Staff management</h1><p class="muted">School Admins appoint registered users as Class Coordinators or Lecturers.</p><div id="staff" class="stack"></div></div><script>fetch('/api/academic/staff/').then(r=>r.json()).then(d=>document.getElementById('staff').innerHTML=d.map(x=>`<div class="list-card"><b>${x.name}</b><span>${x.email} · ${x.role}</span><small>Profile ID: ${x.id}</small></div>`).join(''))</script>{% endblock %}
