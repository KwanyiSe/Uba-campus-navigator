{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050d16">
<title>UNIMAP — Smart Campus Navigation</title>
<link rel="stylesheet" href="{% static 'css/shared.css' %}">
<style>
.landing{min-height:100vh;display:grid;place-items:center;padding:12px;background:#030911;color:#f7fafc}
.landing-panel{width:min(430px,100%);height:min(820px,calc(100vh - 24px));min-height:680px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.20);border-radius:26px;background:linear-gradient(180deg,#06111c 0%,#06101a 52%,#040b13 100%);box-shadow:0 28px 80px rgba(0,0,0,.45)}
.landing-glow{position:absolute;width:340px;height:340px;left:50%;top:12%;transform:translateX(-50%);background:radial-gradient(circle,rgba(18,119,255,.18),transparent 68%);pointer-events:none}
.landing-brand{position:relative;text-align:center;padding:62px 28px 0;z-index:2}.landing-logo{width:86px;height:86px;object-fit:contain;margin:0 auto 14px;display:block}.landing-brand h1{font-size:39px;line-height:1;margin:0 0 12px;letter-spacing:-.045em;color:#f7fbff}.landing-brand h1 span{color:#1677ff}.landing-brand .tag{font-size:15px;color:#e6edf5;margin:0}.landing-brand .sub{font-size:13px;color:#8e9cac;line-height:1.65;margin:28px auto 0;max-width:270px}
.landing-actions{position:relative;z-index:4;display:grid;gap:10px;margin:34px 30px 0}.landing-actions a{height:49px;border-radius:12px;display:grid;place-items:center;font-size:14px;font-weight:750;transition:.18s}.landing-actions a:hover{transform:translateY(-1px)}.landing-primary{background:#1677ff;color:#fff;box-shadow:0 12px 28px rgba(22,119,255,.22)}.landing-outline{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.025);color:#fff}.landing-guest{background:transparent;color:#b9c5d2}
.landing-building{position:absolute;left:50%;bottom:-70px;transform:translateX(-50%);width:100%;height:330px;object-fit:cover;object-position:center bottom;mix-blend-mode:screen;opacity:.88;mask-image:linear-gradient(to bottom,transparent 0%,black 20%,black 100%);-webkit-mask-image:linear-gradient(to bottom,transparent 0%,black 20%,black 100%)}
.landing-footer{position:absolute;bottom:13px;left:0;right:0;text-align:center;color:#617083;font-size:10px;z-index:5;letter-spacing:.02em}
@media(max-height:740px){.landing-brand{padding-top:35px}.landing-actions{margin-top:22px}.landing-building{height:270px;bottom:-58px}.landing-panel{min-height:650px}}
</style>
</head>
<body>
<div class="landing">
  <section class="landing-panel">
    <div class="landing-glow"></div>
    <div class="landing-brand">
      <img class="landing-logo" src="{% static 'img/logo.png' %}" alt="UNIMAP logo">
      <h1>UNI<span>MAP</span></h1>
      <p class="tag">Smart Campus Navigation</p>
      <p class="sub">Navigate. Connect. Succeed.<br>Everything you need on campus, in one place.</p>
    </div>
    <div class="landing-actions">
      <a class="landing-primary" href="{% url 'login' %}">Login</a>
      <a class="landing-outline" href="{% url 'register_page' %}">Register</a>
      <a class="landing-guest" href="{% url 'campus-map' %}">Continue as Guest</a>
    </div>
    <img class="landing-building" src="{% static 'img/landing-building.png' %}" alt="Campus illustration">
    <div class="landing-footer">Campus map · Classes · Free halls · Campus now</div>
  </section>
</div>
</body>
</html>
