{% extends "base.html" %}{% block title %}Manage classes · UNIMAP{% endblock %}{% block content %}<div class="section-head"><div><h1>Manage classes</h1><p class="muted">Upload reference timetables and create the actual sessions students attend.</p></div></div><div class="card"><h2>Create class session</h2><form id="classForm"><label>Course ID<input name="course" required></label><label>Option ID<input name="option" required></label><label>Level<input name="level" type="number" required></label><label>Building ID<input name="building"></label><label>Room<input name="room"></label><label>Day (0 Monday – 6 Sunday)<input name="day_of_week" type="number" min="0" max="6" required></label><label>Start<input name="start_time" type="time" required></label><label>End<input name="end_time" type="time" required></label><label>Date<input name="session_date" type="date"></label><button class="primary-btn">Create class</button></form><p id="result"></p></div><div class="card"><h2>Timetable</h2><form id="tt" enctype="multipart/form-data"><input name="title" placeholder="Timetable title" required><input name="school" placeholder="School ID" required><input name="department" placeholder="Department ID" required><input name="option" placeholder="Option ID" required><input name="level" placeholder="Level" type="number" required><input name="file" type="file" required><button class="secondary-btn">Upload timetable</button></form></div><script>
async function postForm(form,url){let r=await fetch(url,{method:'POST',headers:{'X-CSRFToken':document.cookie.match(/csrftoken=([^;]+)/)?.[1]||''},body:new FormData(form)});let d=await r.json();document.getElementById('result').textContent=d.detail||d.message||JSON.stringify(d);}
classForm.onsubmit=e=>{e.preventDefault();postForm(e.target,'/api/academic/class-sessions/create/')};tt.onsubmit=e=>{e.preventDefault();postForm(e.target,'/api/academic/timetables/')}
</script>{% endblock %}
