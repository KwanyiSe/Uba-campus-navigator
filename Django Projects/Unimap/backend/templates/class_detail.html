{% extends "base.html" %}{% block title %}Class · UNIMAP{% endblock %}{% block content %}<div id="detail" class="stack"><div class="card">Loading class…</div></div><script>
const id=new URLSearchParams(location.search).get('id');
async function load(){let r=await fetch('/api/academic/sessions/');let d=await r.json();let x=d.find(v=>String(v.id)===id);if(!x){detail.innerHTML='<div class="card">Class not found.</div>';return} detail.innerHTML=`<div class="card"><h1>${x.course_code}</h1><p>${x.course_name}</p><p>${x.option_name||''} · Level ${x.level||''}</p><p>${x.building_name||'TBA'} ${x.room||''}</p><p>${x.session_date} · ${x.start_time}–${x.end_time}</p>${x.status==='active'?'<button class="primary-btn" id="mark">Mark Attendance</button>':'<p class="muted">Attendance is available only while the class is active.</p>'}</div>`;if(document.getElementById('mark'))mark.onclick=async()=>{let rr=await fetch('/api/academic/class-sessions/'+id+'/mark-attendance/',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':document.cookie.match(/csrftoken=([^;]+)/)?.[1]||''},body:JSON.stringify({location_verified:false})});let dd=await rr.json();alert(dd.detail||'Attendance updated.')}}load()</script>{% endblock %}
